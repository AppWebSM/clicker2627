<ion-grid>
  <!-- Titulo -->
  <ion-row>
    SHOP {{clicks}}
  </ion-row>

  <ion-row>
  <!-- Items -->
    <ion-list>
      @for (item of items; track item.name) {
      
        <ion-item
        [button]="true"
        [disabled]="clicks < item.price"
        (click)="buyItem(item)">
        <ion-icon [name]="item.icon" slot="start"></ion-icon>
        <ion-label>
          <h2>{{ item.name }}</h2>
          <p>{{ item.description }}</p>
        </ion-label>
        <ion-note slot="end">{{ item.price }}</ion-note>
      </ion-item>
      
      }
    </ion-list>
  </ion-row>
  
</ion-grid>
